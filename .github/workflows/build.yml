name: Build Eagle
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest, script: 'dist:linux' }
          - { name: raspberry-pi, os: ubuntu-latest, script: 'dist:pi' }
          - { name: windows, os: windows-latest, script: 'dist:win' }
          - { name: macos, os: macos-latest, script: 'dist:mac' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npm run ${{ matrix.script }} -- --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false', GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: actions/upload-artifact@v4
        with:
          name: eagle-${{ matrix.name }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.dmg
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm install --no-audit --no-fund
      - run: npx cap add android && node scripts/patch-native.js android
      - run: npx capacitor-assets generate --android || true
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Eagle-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: eagle-android, path: Eagle-android.apk }
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npx cap add ios --packagemanager SPM && node scripts/patch-native.js ios
      - run: npx capacitor-assets generate --ios || true
      - run: npx cap sync ios
      - run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -archivePath build/App.xcarchive CODE_SIGNING_ALLOWED=NO archive
          mkdir -p Payload && cp -R build/App.xcarchive/Products/Applications/App.app Payload/ && zip -qry Eagle-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: eagle-ios, path: Eagle-ios-unsigned.ipa }
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: out/**/* }
